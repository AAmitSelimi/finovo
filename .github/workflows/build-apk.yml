name: Build Finovo APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner already has the Android SDK; only the licenses must be accepted.
      - name: Accept Android SDK licenses
        run: yes | "$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)" --licenses > /dev/null || true

      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --console=plain -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
        continue-on-error: true

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Release check (R8 + App Bundle, unsigned)
        run: ./gradlew bundleRelease assembleRelease --console=plain -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: Finovo-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Publish APK to branch apk-latest
        run: |
          mkdir /tmp/apkpub && cp app/build/outputs/apk/debug/*.apk /tmp/apkpub/Finovo-debug.apk
          cd /tmp/apkpub && git init -q -b apk-latest
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add . && git commit -qm "Finovo debug APK ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk-latest
